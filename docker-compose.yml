name: max-course-agent

services:
  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -hf
      - smarttasks/Qwen3-Embedding-0.6B-GGUF:Q4_K_M
      - --alias
      - qwen3-embedding-0.6b
      - --embeddings
      - --pooling
      - last
      - --ctx-size
      - "2048"
      - --parallel
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-webui
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 5m
      retries: 60
    volumes:
      - embedding_model_cache:/root/.cache
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-max_courses}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change_me_admin}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:-change_me_app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-max_courses}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-max_courses}
      POSTGRES_USER: maxbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_app}
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-max_courses}
      POSTGRES_USER: maxbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_app}
    command: ["python", "index_courses.py"]
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_healthy

volumes:
  postgres_data:
  embedding_model_cache:
